# bundle patch —— 作为 DSH bundle 安装时，自动把插件行插进 profile 组合树。
#
# 组成顺序：各 bundle 的 patch 按 `dsh.profile.bundles` 顺序叠加，再叠 profile 自己的
# `cordis.patch.yml`。所以以下两种装法任选其一，不要同时用（同一个 id 会被插两次）：
#
#   A. 作为 bundle：把包加进 profile 的 `dsh.profile.bundles`（本文件生效）
#   B. 手动：在 profile 的 `cordis.patch.yml` 里自己写一段 insert（本文件不参与）
- insert:
    - id: date-workspace
      name: dsh-date-workspace
