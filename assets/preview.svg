<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-label="dsh-date-workspace 对话框预览">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
      .title { fill: #e9eaee; font-size: 15px; font-weight: 600; }
      .sub { fill: #8b919c; font-size: 12px; }
      .label { fill: #a4aab5; font-size: 12px; }
      .value { fill: #dfe1e6; font-size: 12px; }
      .hint { fill: #7c828d; font-size: 11px; }
    </style>
  </defs>

  <rect width="560" height="360" fill="none"/>

  <!-- dialog panel -->
  <g filter="url(#shadow)">
    <rect x="40" y="24" width="480" height="300" rx="14" fill="#1b1c21" stroke="#3a3d47" stroke-width="1"/>
  </g>

  <!-- header -->
  <text class="t title" x="64" y="60">新建工作区</text>
  <text class="t sub" x="64" y="82">按日期创建工作区，或浏览其他文件夹。</text>

  <!-- date row -->
  <text class="t label" x="64" y="115">日期</text>
  <rect x="104" y="96" width="140" height="30" rx="8" fill="#24262d" stroke="#3a3d47"/>
  <text class="t value" x="116" y="115">2026-11-12</text>
  <rect x="252" y="96" width="44" height="30" rx="9" fill="none" stroke="#3a3d47"/>
  <text class="t value" x="266" y="115">今天</text>
  <rect x="302" y="96" width="44" height="30" rx="9" fill="none" stroke="#3a3d47"/>
  <text class="t value" x="316" y="115">明天</text>

  <!-- base directory row -->
  <text class="t label" x="64" y="155">基目录</text>
  <rect x="104" y="136" width="392" height="30" rx="8" fill="#24262d" stroke="#3a3d47"/>
  <text class="mono" x="116" y="155" fill="#cfd2d9" font-size="12">D:\工作空间\dsh-work</text>

  <!-- preview -->
  <rect x="64" y="176" width="432" height="32" rx="9" fill="#23252b"/>
  <text class="mono" x="76" y="196" fill="#a9aeb8" font-size="12">将创建: D:\工作空间\dsh-work\2026-11-12</text>

  <!-- hint -->
  <text class="t hint" x="64" y="232">星期四 · 目录已存在时直接打开，不覆盖内容。</text>

  <!-- actions -->
  <rect x="246" y="246" width="96" height="32" rx="9" fill="none" stroke="#3a3d47"/>
  <text class="t value" x="258" y="267">浏览文件夹…</text>
  <rect x="350" y="246" width="48" height="32" rx="9" fill="none" stroke="#3a3d47"/>
  <text class="t value" x="365" y="267">取消</text>
  <rect x="406" y="246" width="90" height="32" rx="9" fill="#4d6bfe"/>
  <text class="t" x="420" y="267" fill="#ffffff" font-size="12" font-weight="500">创建并打开</text>
</svg>
